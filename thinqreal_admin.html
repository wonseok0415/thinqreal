<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinQ Real Admin — 사내 이전 안내</title>
<meta name="robots" content="noindex">
<!-- 은퇴 모드 (2026-11-09 사내 전환 완료) — 안내 전용 정적 페이지. 스크립트·외부 리소스·Apps Script 호출 0. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #3a5035; --accent-deep: #2c3e28; --label: #1d1d1f; --label-2: #6e6e73; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--accent);
    background-image: radial-gradient(ellipse at 65% 25%, #4e6b49 0%, var(--accent) 65%);
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: var(--label); line-height: 1.65;
  }
  .card {
    background: #fff; border-radius: 20px; max-width: 520px; width: 100%;
    padding: 48px 40px; text-align: center;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
  }
  .logo { font-size: 20px; font-weight: 600; color: var(--accent); letter-spacing: -0.025em; }
  .subtitle { font-size: 11.5px; color: #aeaeb2; letter-spacing: 0.06em; text-transform: uppercase; margin: 4px 0 28px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 14px; }
  p { font-size: 14px; color: var(--label-2); margin-bottom: 8px; word-break: break-all; }
  p strong { color: var(--label); font-weight: 600; }
  .go {
    display: inline-block; margin: 20px 0 6px; background: var(--accent); color: #fff;
    font-size: 14.5px; font-weight: 600; text-decoration: none;
    padding: 13px 28px; border-radius: 12px;
  }
  .go:hover { background: var(--accent-deep); }
  .net { font-size: 12.5px; color: var(--label-2); margin-bottom: 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">ThinQ Real</div>
    <div class="subtitle">Admin Dashboard</div>
    <h1>관리자 페이지는 사내 주소로 이전했습니다</h1>
    <p>관리자 페이지는 <strong>https://thinqreal.lge.com/thinqreal_admin.html</strong> 에서 이용하실 수 있습니다(사내망·SSO 로그인).</p>
    <p>이 페이지의 로그인과 대시보드 기능은 종료되었습니다.</p>
    <a class="go" href="https://thinqreal.lge.com/thinqreal_admin.html">사내 관리자 페이지로 이동</a>
    <p class="net">※ 사내망에서만 접속 가능합니다.</p>
  </main>
</body>
</html>
