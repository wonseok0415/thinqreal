<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinQ Real 방문 후기 — 사내 이전 안내</title>
<meta name="robots" content="noindex">
<!-- 은퇴 모드 (2026-11-09 사내 전환 완료) — 전환 전 발송된 설문 초대 링크가 이 페이지로 연결됨. 스크립트·Apps Script 호출 0. -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #3a5035; --accent-deep: #2c3e28; --label: #1d1d1f; --label-2: #6e6e73; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #fbfbfd 0%, #eef2ec 100%);
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: var(--label); line-height: 1.65;
  }
  .card {
    background: #fff; border-radius: 20px; max-width: 560px; width: 100%;
    padding: 48px 40px; text-align: center;
    box-shadow: 0 18px 60px rgba(42, 58, 38, 0.14);
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 32px; }
  .brand img { height: 26px; }
  .brand .divider { width: 1px; height: 20px; background: #d2d2d7; }
  .brand .name { font-size: 17px; font-weight: 600; color: var(--accent); letter-spacing: -0.02em; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; }
  p { font-size: 14.5px; color: var(--label-2); margin-bottom: 10px; }
  p strong { color: var(--label); font-weight: 600; }
  .go {
    display: inline-block; margin: 22px 0 6px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; text-decoration: none;
    padding: 14px 32px; border-radius: 12px;
  }
  .go:hover { background: var(--accent-deep); }
  .net { font-size: 12.5px; color: var(--label-2); margin-bottom: 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="images/LG_AI_Home_logo.png" alt="LG AI Home">
      <span class="divider"></span>
      <span class="name">ThinQ Real</span>
    </div>
    <h1>방문 후기 설문은 사내 주소에서 진행됩니다</h1>
    <p>ThinQ Real이 2026년 11월 9일 사내 시스템(<strong>thinqreal.lge.com</strong>, 사내망·SSO)으로 이전하면서, 방문 후기 설문도 사내 주소에서 진행됩니다.</p>
    <p>이전 안내 메일로 받으신 설문 링크는 이 페이지로 연결됩니다. 새 설문 주소는 담당자가 메일로 다시 안내드립니다.</p>
    <a class="go" href="https://thinqreal.lge.com">thinqreal.lge.com 으로 이동</a>
    <p class="net">※ 사내망에서만 접속 가능합니다. 문의: ThinQ Real 담당자</p>
  </main>
</body>
</html>
